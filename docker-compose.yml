version: "3.9"

services:
  auth_service:
    image: authorization_door_c:v1.0
    container_name: authentication_service
    build:
      context: .
      dockerfile: authentication/Dockerfile 
    init: true
    ports:
      - 3490:3490
    networks:
      - doorNetwork
    env_file:
      - docker/variables/docker_compose_variables_auth.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 128M


  db:
    image: mysql:8.4
    container_name: mysql-db
    volumes:
      - mysqldata:/var/lib/mysql
      - .docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - docker/variables/docker_compose_variables_db.env
    networks:
      - doorNetwork
    ports:
      - "3306:3306"
    restart: unless-stopped
    command: --mysql-native-password=ON
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysqldata:
networks:
  doorNetwork:
